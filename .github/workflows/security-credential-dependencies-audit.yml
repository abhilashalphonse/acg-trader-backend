name: Read-only ACG Trader backend authentication dependency audit

on:
  pull_request:
    paths:
      - '.github/workflows/security-credential-dependencies-audit.yml'

permissions:
  contents: read

jobs:
  dependency-audit:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact lockfile install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Summarize production advisories without leaking secrets
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/backend-audit.json || true
          node - <<'JS'
          const d=require('/tmp/backend-audit.json');
          console.log('BACKEND_DEPENDENCY_SECURITY',JSON.stringify({
            counts:d.metadata?.vulnerabilities||{},error:d.error?.code||null,
            issues:Object.entries(d.vulnerabilities||{}).map(([name,x])=>({
              name,severity:x.severity,isDirect:x.isDirect,fixAvailable:x.fixAvailable
            }))
          }));
          JS
