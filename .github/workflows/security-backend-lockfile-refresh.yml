name: Refresh vulnerable backend lockfile (restricted repair)

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/security-backend-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  backend-lock:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/remediate-auth-dependency-advisories-20261116' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remediate-auth-dependency-advisories-20261116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recompute lockfile, patch vulnerable transitive packages without scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify actual dependency tree and advisory-free production packages
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=moderate
          # Full authenticated MongoDB test suite runs in Backend CI after this lockfile is committed.
      - name: Commit exact resolved lockfile to restricted branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "security: resolve vulnerable mongoose, parser, qs and zod lockfile"
            git push origin HEAD:refs/heads/security/remediate-auth-dependency-advisories-20261116
          fi
