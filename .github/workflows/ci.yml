name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/acg_trader_test
      MARKET_GATEWAY_ENABLED: 'false'
      TRADING_API_ENABLED: 'true'
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run test suite
        run: npm test
