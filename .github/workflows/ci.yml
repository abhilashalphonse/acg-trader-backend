name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/acg_trader_test?replicaSet=rs0
      MARKET_GATEWAY_ENABLED: 'false'
      TRADING_API_ENABLED: 'true'
      PLATFORM_EVENTS_ENABLED: 'false'
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Install dependencies
        run: npm ci

      - name: Reject high and moderate production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Syntax check
        run: find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit test suite
        run: npm test

      - name: Run MongoDB runtime smoke
        run: npm run test:runtime

      - name: Run B2B two-tenant Mongo HTTP and WebSocket acceptance
        env:
          B2B_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/acg_b2b_isolation_test?replicaSet=rs0
        run: node --test tests/integration/b2b-two-tenant.test.js

      - name: Run AI Phase 1 isolated replica-set adversarial acceptance
        env:
          ACG_AI_ISOLATED_CI: 'true'
        run: node scripts/ai-phase1-acceptance.js

      - name: Run AI Phase 2 deterministic intelligence benchmarks
        run: node scripts/ai-intelligence-benchmark.js
