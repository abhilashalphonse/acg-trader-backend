name: Accelpix Dependency Audit

on:
  push:
    branches:
      - accelpix-integration
    paths:
      - .github/workflows/accelpix-dependency-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accelpix-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --json || true
