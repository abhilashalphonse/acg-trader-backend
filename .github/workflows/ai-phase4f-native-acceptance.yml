name: Phase 4F isolated native chat acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ACG_AI_ISOLATED_CI: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/acg_trader_test?replicaSet=rs0
      MARKET_GATEWAY_ENABLED: 'false'
      TRADING_API_ENABLED: 'true'
      PLATFORM_EVENTS_ENABLED: 'false'
      CORS_ORIGINS: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhilashalphonse/acg-trader-frontend
          ref: 7ed30caafe202f2a1b71716625c759386952e8c9
          token: ${{ secrets.ACG_E2E_REPO_READ_TOKEN }}
          path: frontend
          persist-credentials: false
      - name: Start isolated Mongo replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend fixture dependencies
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Boot loopback dev fixture
        working-directory: frontend
        env:
          VITE_ACG_TRADER_API_BASE: http://127.0.0.1:65534
          VITE_ACG_TRADER_WS_URL: ws://127.0.0.1:65534
        run: |
          npm run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/acg-phase4f-vite.log 2>&1 &
          echo $! > /tmp/acg-phase4f-vite.pid
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5174/ai-phase4f-audit.html > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --include=dev
      - name: Run real authenticated API and browser acceptance
        working-directory: backend
        env:
          ACG_AI_PHASE4F_BROWSER_DIR: ${{ github.workspace }}/frontend
        run: node scripts/ai-phase1-acceptance.js
      - if: always()
        run: if [ -f /tmp/acg-phase4f-vite.pid ]; then kill "$(cat /tmp/acg-phase4f-vite.pid)" 2>/dev/null || true; fi
